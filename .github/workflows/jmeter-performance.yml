name: Teste Técnico de Performance - BlazeDemo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite que você ative o teste manualmente clicando em um botão no GitHub

jobs:
  performance-test:
    name: Executar Testes no JMeter
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código fonte
      uses: actions/checkout@v4

    - name: Configurar ambiente Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Baixar e Instalar Apache JMeter 5.6.3
      run: |
        wget https://apache.org
        tar -xzf apache-jmeter-5.6.3.tgz
        echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

    - name: Verificar integridade dos arquivos de massa e script
      run: |
        ls -la
        if [ ! -f "script_blazedemo.jmx" ]; then echo "ERRO: script_blazedemo.jmx não encontrado!"; exit 1; fi
        if [ ! -f "dados_passageiros.csv" ]; then echo "ERRO: dados_passageiros.csv não encontrado!"; exit 1; fi

    - name: Executar Teste de Performance (Modo CLI)
      run: |
        jmeter -Djava.net.preferIPv4Stack=true -n -t script_blazedemo.jmx -l resultado.jtl -e -o ./relatorio-html

    - name: Publicar Relatório HTML como Artefato do GitHub
      if: always() # Garante que o relatório seja salvo mesmo se houver falhas nas requisições
      uses: actions/upload-artifact@v4
      with:
        name: relatorio-performance-jmeter
        path: ./relatorio-html/
        retention-days: 7
